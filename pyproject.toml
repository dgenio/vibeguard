[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibeguard-gate"
version = "0.10.0"
description = "Guardrails for vibe-coded software — a pre-merge safety gate for AI-generated changes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "VibeGuard Contributors" }]
keywords = ["security", "ai", "code-review", "static-analysis", "devtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
# Library-grade dependency policy (#121): VibeGuard co-installs into users'
# existing environments and runs as a pre-commit hook / CI step, so it must
# not force version conflicts on adopters. Runtime deps therefore use
# lower bounds only (``>=``) — no exact pins (``==``) and no speculative
# upper-bound caps. Any cap added later must carry an inline comment citing
# the specific incompatibility. The floor CI job resolves these declarations
# directly with uv ``lowest-direct`` and proves the resulting suite passes.
dependencies = [
    # typer<0.16 can't build CLI options annotated ``X | None`` and pulls a
    # click whose CliRunner mixes stderr into stdout; the floor job proves
    # 0.16.0 is the real minimum.
    "typer>=0.16.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pathspec>=0.12.0",
    "tomli>=2.0.0; python_version<'3.11'",
]

# Backward-compatible source-install shim only. Historical docs/releases may
# still contain `pip install -e ".[dev]"`; keeping the empty extra makes that
# command harmless without publishing any maintainer-only dependencies.
[project.optional-dependencies]
dev = []

# PEP 735 local-only tooling. This dependency group is not published in wheel
# metadata and is only for contributors / CI. The separate `dev` optional extra
# above is intentionally empty and exists only as a backward-compatibility shim.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
    "hypothesis>=6.31",
    "jsonschema>=4.0",
    # Enforces the offline guarantee (#223): sockets are disabled by default in
    # the test run (see ``[tool.pytest.ini_options].addopts``), so any test that
    # opens a real network connection fails instead of silently phoning home.
    "pytest-socket>=0.7.0",
]

[project.scripts]
vibeguard = "vibeguard.cli:app"

[project.urls]
Homepage = "https://github.com/dgenio/vibeguard"
Repository = "https://github.com/dgenio/vibeguard"
Issues = "https://github.com/dgenio/vibeguard/issues"
Changelog = "https://github.com/dgenio/vibeguard/releases"

[tool.ruff]
target-version = "py310"
line-length = 100
# Fixture files are intentionally pathological (vulnerable-looking
# secrets, eval(), disabled auth, etc.) so the rules have realistic
# inputs. Linting them would defeat the point. ``benchmarks/scenarios``
# holds the same kind of deliberately-unsafe evaluation fixtures.
extend-exclude = ["tests/fixtures", "benchmarks/scenarios"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = false
# Typing ratchet (#189): first wave. These two flags let the checker see the
# core data flow — every function in ``vibeguard/`` carries annotations, and an
# implicit ``Optional`` is no longer silently inferred. Global
# ``ignore_missing_imports`` is intentionally *not* set: unstubbed third-party
# imports are allow-listed per-module below so a genuinely missing first-party
# type can't hide behind a blanket ignore. Further strictness flags land in
# later waves.
disallow_untyped_defs = true
no_implicit_optional = true

# Unstubbed third-party imports. ``pathspec`` ships no type stubs; ``tomli`` /
# ``tomllib`` are the version-guarded TOML parser pair in ``rules/_util.py``
# (stdlib ``tomllib`` on 3.11+, the ``tomli`` backport on 3.10) — under the
# 3.10 target mypy can't resolve the stdlib name, so both are allow-listed.
[[tool.mypy.overrides]]
module = ["pathspec.*", "tomli", "tomllib"]
ignore_missing_imports = true

[tool.coverage.run]
# Branch coverage is enabled deliberately (#187): it reads lower than line
# coverage but catches untested conditional paths, which matter most for a
# gate. Measured against the ``vibeguard`` package only (tests/benchmarks are
# not the subject under test).
branch = true
source = ["vibeguard"]

[tool.coverage.report]
# Enforced floor (#187), a ratchet: it only moves *up*. Set 2 points below the
# measured branch coverage at introduction (~89%) to absorb per-run variance;
# a PR that meaningfully raises coverage may raise this number, but nothing
# may lower it. ``pytest-cov`` reads this automatically, so CI fails when a
# change drops below it without any extra workflow flag. See CONTRIBUTING.md.
fail_under = 87

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``--disable-socket`` enforces the offline guarantee (#223): the whole suite
# runs with network sockets blocked, so a rule, reporter, or dependency that
# starts making network calls fails loudly here instead of eroding the
# "no network, no API key" thesis. The opt-in slopsquat registry check is
# tested with its lookup mocked, so it needs no socket. If a test ever
# legitimately requires a socket, mark it ``@pytest.mark.enable_socket``.
addopts = "-v --disable-socket"
markers = [
    "enable_socket: allow a test to open network sockets (opt-in exception to the offline guarantee, #223)",
]

[tool.hatch.build.targets.wheel]
packages = ["vibeguard"]
# Hatchling includes all files within configured packages by default, but
# pin the bundled policy-pack YAMLs explicitly so a future packaging-layout
# tweak can't silently drop them from the wheel.
artifacts = ["vibeguard/policies/*.yaml"]
