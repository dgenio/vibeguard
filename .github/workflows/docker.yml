name: Docker

on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "vibeguard/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "vibeguard/**"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build & smoke-test image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: vibeguard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — version
        run: docker run --rm vibeguard:ci version

      - name: Smoke test — scan vulnerable-node-package (JSON)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/examples:/scan:ro" \
            vibeguard:ci scan \
              --path /scan/vulnerable-node-package \
              --json \
            > /tmp/findings.json
          test -s /tmp/findings.json
          jq -e '.findings | length > 0' /tmp/findings.json

      - name: Smoke test — non-root user
        run: |
          UID_RUN=$(docker run --rm --entrypoint id vibeguard:ci -u)
          test "$UID_RUN" -ne 0
