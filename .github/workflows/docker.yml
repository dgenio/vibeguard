name: Docker

on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "vibeguard/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "vibeguard/**"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build & smoke-test image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: vibeguard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — version
        run: docker run --rm vibeguard:ci version

      - name: Smoke test — scan vulnerable-node-package (JSON)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/examples:/scan:ro" \
            vibeguard:ci scan \
              --path /scan/vulnerable-node-package \
              --json \
            > /tmp/findings.json
          test -s /tmp/findings.json
          jq -e '.findings | length > 0' /tmp/findings.json

      - name: Smoke test — non-root user
        run: |
          UID_RUN=$(docker run --rm --entrypoint id vibeguard:ci -u)
          test "$UID_RUN" -ne 0
