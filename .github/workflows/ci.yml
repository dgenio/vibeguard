name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: surface a breaking dependency release early (the safety net
    # that justifies VibeGuard's no-upper-cap dependency policy, #121).
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint (latest deps)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Support Python 3.10 -> 3.14 inclusive (#121).
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check vibeguard/ tests/ benchmarks/

      - name: Check formatting with ruff
        run: ruff format --check vibeguard/ tests/ benchmarks/

      - name: Type check with mypy
        run: mypy vibeguard/

      - name: Run tests with coverage
        run: pytest --tb=short --cov=vibeguard --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml

  floor-deps:
    name: Floor deps (minimum versions, 3.10)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        run: python -m pip install uv

      # Resolve every direct requirement to the lower bound declared in
      # pyproject.toml. This removes the second, hand-maintained source of truth
      # that constraints-min.txt used to duplicate.
      - name: Install declared minimum dependency versions
        run: uv pip install --system --resolution lowest-direct -e ".[dev]"

      - name: Show resolved floor versions
        run: pip list

      - name: Run tests against the floor
        run: pytest --tb=short

  latest-deps:
    name: Latest / pre-release deps (3.14, best-effort)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install with newest (pre-release) dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --pre --upgrade typer rich pydantic pyyaml pathspec

      - name: Show resolved versions
        run: pip list

      - name: Run tests against newest deps
        run: pytest --tb=short

  install-smoke:
    name: Co-install smoke (resolver + pre-commit hook)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Co-install alongside common stacks
        run: |
          python -m venv /tmp/coinstall
          . /tmp/coinstall/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl fastapi "pydantic>=2" rich-click
          vibeguard --version

      - name: Smoke-test the pre-commit hook
        run: |
          pip install pre-commit
          pre-commit try-repo . vibeguard-scan --all-files --verbose

  vibeguard-self-check:
    name: VibeGuard self-scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install VibeGuard
        run: pip install -e ".[dev]"

      - name: Run VibeGuard gate
        run: vibeguard gate --path . --fail-on critical

  offline-guarantee:
    name: Offline guarantee (no-network CLI)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install VibeGuard
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run core commands with networking disabled
        run: |
          set -x
          VG="$(command -v vibeguard)"
          if ! sudo unshare --net -- true; then
            echo "::error::'sudo unshare --net' is unavailable on this runner; cannot enforce the no-network job"
            exit 1
          fi
          fail=0
          run_offline() {
            local name="$1" accept="$2"; shift 2
            local rc=0
            sudo unshare --net -- "$VG" "$@" || rc=$?
            if ! printf '%s\n' $accept | grep -qx "$rc"; then
              echo "::error::'$name' exited $rc with networking disabled (accepted: $accept)"
              fail=1
            fi
          }
          run_offline scan "0" scan --path examples/vulnerable-python-package
          run_offline gate "0 1" gate --path examples/vulnerable-python-package --fail-on critical
          run_offline publish-check "0 1" publish-check --path examples/vulnerable-python-package
          run_offline explain "0" explain SEC-ENV
          exit "$fail"
