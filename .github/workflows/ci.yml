name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: surface a breaking dependency release early (the safety net
    # that justifies VibeGuard's no-upper-cap dependency policy, #121).
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint (latest deps)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Support Python 3.10 -> 3.14 inclusive (#121).
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # No-op for versions with a stable toolcache entry; lets newer
          # interpreters (e.g. 3.14 during the window where only an RC is
          # cached) resolve instead of failing the run. We keep 3.14 a hard
          # gate — issue #121 wants CI green on 3.10-3.14 — rather than
          # marking it continue-on-error.
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Lint with ruff
        run: ruff check vibeguard/ tests/ benchmarks/

      - name: Check formatting with ruff
        run: ruff format --check vibeguard/ tests/ benchmarks/

      - name: Type check with mypy
        run: mypy vibeguard/

      - name: Run tests with coverage
        run: pytest --tb=short --cov=vibeguard --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml

  floor-deps:
    name: Floor deps (minimum versions, 3.10)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        run: python -m pip install uv

      # Resolve every direct requirement to the lower bound declared in
      # pyproject.toml. This removes the second, hand-maintained source of truth
      # that constraints-min.txt used to duplicate while preserving the same
      # runtime proof that each >= floor is truthful.
      - name: Install declared minimum dependency versions
        run: uv pip install --system --resolution lowest-direct -e . --group dev

      - name: Show resolved floor versions
        run: pip list

      - name: Run tests against the floor
        run: pytest --tb=short

  latest-deps:
    name: Latest / pre-release deps (3.14, best-effort)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Scheduled / on-demand only: newest deps (incl. pre-releases) catch a
    # breaking upstream release early. Allowed to fail so it never blocks a
    # PR — it's an early-warning signal, not a gate (#121).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install with newest (pre-release) dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
          pip install --pre --upgrade typer rich pydantic pyyaml pathspec

      - name: Show resolved versions
        run: pip list

      - name: Run tests against newest deps
        run: pytest --tb=short

  install-smoke:
    name: Co-install smoke (resolver + pre-commit hook)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      # Prove the "frictionless, no forced pins" promise: VibeGuard's wheel
      # co-installs cleanly into an env that already carries common stacks
      # (which themselves depend on click/pydantic/typing-extensions). A
      # clean exit means the resolver found a compatible set (#121).
      - name: Co-install alongside common stacks
        run: |
          python -m venv /tmp/coinstall
          . /tmp/coinstall/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl fastapi "pydantic>=2" rich-click
          vibeguard --version

      - name: Smoke-test the pre-commit hook
        run: |
          pip install pre-commit
          # `try-repo` wires this repo's .pre-commit-hooks.yaml into a
          # throwaway config, builds the hook's isolated `language: python`
          # environment (the resolver check) and runs it end-to-end. We use
          # the informational `vibeguard-scan` hook, which always exits 0, so
          # this proves the hook installs and runs without coupling the smoke
          # test to whether this repo happens to be clean at --fail-on high.
          pre-commit try-repo . vibeguard-scan --all-files --verbose

  vibeguard-self-check:
    name: VibeGuard self-scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install VibeGuard
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Run VibeGuard gate
        run: vibeguard gate --path . --fail-on critical

  offline-guarantee:
    name: Offline guarantee (no-network CLI)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install VibeGuard
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      # Unit-level enforcement lives in the test job (pytest runs with
      # ``--disable-socket``, #223). This job is the integration proof: run the
      # core commands as real subprocesses inside a network namespace with **no**
      # connectivity, catching any network use that in-process socket patching
      # could miss (subprocess children, C-level sockets). ``sudo unshare --net``
      # uses real root, so it needs no unprivileged-userns support (restricted on
      # newer Ubuntu images); the console script's absolute shebang makes it
      # runnable as root without PATH juggling. The commands do pure local file
      # I/O, so exit 2 (operational error) here would mean an unexpected network
      # dependency — that is the failure this job exists to surface.
      - name: Run core commands with networking disabled
        run: |
          set -x
          VG="$(command -v vibeguard)"

          # Preflight: prove the sandbox itself works. If 'sudo unshare --net' is
          # blocked/unsupported on the runner it commonly exits non-zero — catch
          # that here and fail loudly, so it can never be misread as a command's
          # "blocking findings" (exit 1) in the checks below.
          if ! sudo unshare --net -- true; then
            echo "::error::'sudo unshare --net' is unavailable on this runner; cannot enforce the no-network job"
            exit 1
          fi

          fail=0
          # $1 = label, $2 = accepted exit codes (space-separated), rest = argv.
          # ``|| rc=$?`` keeps the runner's default ``bash -e`` from aborting on a
          # command's expected non-zero (gate/publish-check block on findings).
          run_offline() {
            local name="$1" accept="$2"; shift 2
            local rc=0
            sudo unshare --net -- "$VG" "$@" || rc=$?
            if ! printf '%s\n' $accept | grep -qx "$rc"; then
              echo "::error::'$name' exited $rc with networking disabled (accepted: $accept)"
              fail=1
            fi
          }
          # Per-command expected codes: scan/explain are informational and must
          # succeed (0); gate/publish-check may block on findings (0 or 1). Any
          # other code — especially 2 (operational error) — under no network
          # signals an unexpected network dependency, which is what this job exists
          # to surface.
          run_offline scan "0" scan --path examples/vulnerable-python-package
          run_offline gate "0 1" gate --path examples/vulnerable-python-package --fail-on critical
          run_offline publish-check "0 1" publish-check --path examples/vulnerable-python-package
          run_offline explain "0" explain SEC-ENV
          exit "$fail"
